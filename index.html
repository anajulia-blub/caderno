function closeSearch(){$('#search').style.display='none'}
function doSearch(q){
  q=q.toLowerCase().trim();
  const items=[
    ...db.pages.map(p=>({ic:p.icon||'📄',l:p.title||'Sem título',t:typeLbl[p.type],h:'#/page/'+p.id,s:(p.title+' '+(p.blocks||[]).map(b=>b.text).join(' ')+' '+(p.cards||[]).map(c=>c.text).join(' ')).toLowerCase()})),
    ...db.tasks.map(t=>({ic:t.status==='done'?'☑':'☐',l:t.title,t:'Tarefa',task:t.id,s:(t.title+' '+t.notes).toLowerCase()})),
    ...db.meetings.map(m=>({ic:'🎙️',l:m.title,t:'Reunião',h:'#/meeting/'+m.id,s:(m.title+' '+m.summary+' '+(m.decisions||[]).join(' ')).toLowerCase()}))];
  sRes=(q?items.filter(x=>x.s.includes(q)):items.filter(x=>x.h)).slice(0,30);sSel=0;
  $('#search .res').innerHTML=sRes.map((r,i)=>`<div class="r ${i===0?'sel':''}" data-i="${i}"><span>${r.ic}</span><span>${esc(r.l)}</span><span class="t">${r.t}</span></div>`).join('')||'<div class="empty" style="padding:14px">Nada encontrado.</div>';
  $$('#search .r').forEach(el=>el.onclick=()=>pickSearch(+el.dataset.i));
}
function pickSearch(i){const r=sRes[i];if(!r)return;closeSearch();if(r.task)openTask(r.task);else go(r.h)}
$('#search input').addEventListener('input',e=>doSearch(e.target.value));
$('#search input').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sSel=(sSel+(e.key==='ArrowDown'?1:-1)+sRes.length)%sRes.length;$$('#search .r').forEach((x,j)=>x.classList.toggle('sel',j===sSel))}
  if(e.key==='Enter')pickSearch(sSel)});
$('#search').addEventListener('mousedown',e=>{if(e.target.id==='search')closeSearch()});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}});

/* ============ agenda (calendário + tarefas) ============ */
const SPACE_COLORS=['var(--pink)','var(--yellow)','var(--blue)','var(--green)','var(--sand)'];
const spaceColor=id=>{const i=db.spaces.findIndex(s=>s.id===id);return db.spaces[i]?.color||SPACE_COLORS[(i<0?4:i)%SPACE_COLORS.length]};
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pdate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const hm2m=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const m2hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const AG_H0=7,AG_H1=23,AG_PX=60;
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
function settings(){db.settings=db.settings||{};const s=db.settings;
  if(db.spaces.find(x=>x.icon==='🫧'))db.spaces.forEach(x=>{if(x.icon==='🫧')x.icon='💧'});s.routine=s.routine||[{days:[1,2,3,4,5],from:'09:00',to:'13:00',spaces:['sp_sv','sp_ultra']},{days:[1,2,3,4,5],from:'14:00',to:'17:00',spaces:['sp_blub']},{days:[0,6],from:'10:00',to:'12:00',spaces:[]}];
  if(s.gcalPush===undefined)s.gcalPush=true;return s}
const defDur=t=>t.estimate||(t.tipo==='Projeto'?60:t.tipo==='Lembrete'?15:30);

/* ---- Google Calendar (OAuth no navegador, sem servidor) ---- */
const GSCOPE='https://www.googleapis.com/auth/calendar.events';
let gTok=null,gClient=null,gCache={},gErr='';
try{const t=JSON.parse(sessionStorage.getItem('caderno.gtok'));if(t&&t.exp>Date.now())gTok=t}catch(e){}
const gBridge=()=>{const st=db.settings||{};return st.gasUrl&&st.gasKey?st:null};
const gOn=()=>!!gBridge()||!!(gTok&&gTok.exp>Date.now());
async function gas(payload){const b=gBridge();const r=await fetch(b.gasUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,key:b.gasKey})});const j=await r.json();if(j.error)throw new Error(j.error);return j}
function loadGis(){return new Promise((ok,ko)=>{if(window.google?.accounts?.oauth2)return ok();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=ok;s.onerror=()=>ko(new Error('não carregou o Google'));document.head.appendChild(s)})}
async function gLogin(silent){
  const cid=settings().gcalClientId;if(!cid)return go('#/settings');
  await loadGis();
  return new Promise(ok=>{
    gClient=google.accounts.oauth2.initTokenClient({client_id:cid,scope:GSCOPE,callback:r=>{
      if(r.access_token){gTok={t:r.access_token,exp:Date.now()+(r.expires_in-60)*1000};try{sessionStorage.setItem('caderno.gtok',JSON.stringify(gTok))}catch(e){}gCache={};gErr='';render()}
      else{gErr=r.error||'falhou'}ok()}});
    gClient.requestAccessToken({prompt:silent?'':'consent'});
  });
}
async function gApi(path,opt={}){
  if(!gOn())throw new Error('auth');
  const r=await fetch('https://www.googleapis.com/calendar/v3/'+path,{...opt,headers:{Authorization:'Bearer '+gTok.t,'Content-Type':'application/json'}});
  if(r.status===401){gTok=null;throw new Error('auth')}
  if(r.status===204)return null;
  if(!r.ok)throw new Error('Google respondeu '+r.status);
  return r.json();
}
const CAL_ALIAS={'Calendar':'São Vicente','Blub - meetings':'Blub','Holidays in Brazil':'Feriados'};
const calName=n=>(db.settings?.calNames||{})[n]||CAL_ALIAS[n]||n;
let agCals=[];
async function gLoad(from,to){
  const k=dstr(from)+'_'+dstr(to);if(gCache[k])return gCache[k];
  if(gBridge()){const j=await gas({action:'list',from:from.toISOString(),to:to.toISOString()});
    const evs=(j.items||[]).filter(e=>!e.task).map(e=>{const st=new Date(e.start);return{id:e.id,title:e.title||'(sem título)',allDay:e.allDay,start:e.allDay?pdate(e.start.slice(0,10)):st,end:e.allDay?pdate(e.end.slice(0,10)):new Date(e.end),where:e.where||'',people:e.people||[],cal:calName(e.cal||''),color:e.color||'',link:`https://calendar.google.com/calendar/r/day/${st.getFullYear()}/${st.getMonth()+1}/${st.getDate()}`}});
    gCache[k]=evs;return evs}
  const q=new URLSearchParams({timeMin:from.toISOString(),timeMax:to.toISOString(),singleEvents:'true',orderBy:'startTime',maxResults:'250'});
  const j=await gApi('calendars/primary/events?'+q);
  const evs=(j.items||[]).filter(e=>e.status!=='cancelled'&&!e.extendedProperties?.private?.cadernoTask).map(e=>({id:e.id,title:e.summary||'(sem título)',allDay:!e.start.dateTime,
    start:e.start.dateTime?new Date(e.start.dateTime):pdate(e.start.date),end:e.end.dateTime?new Date(e.end.dateTime):pdate(e.end.date),
    where:e.location||'',link:e.hangoutLink||e.htmlLink,people:(e.attendees||[]).filter(a=>!a.self).map(a=>(a.displayName||a.email||'').split(/[ @]/)[0])}));
  gCache[k]=evs;return evs;
}
function blockTimes(b){const d=pdate(b.date);const s=new Date(d);s.setMinutes(hm2m(b.start));const e=new Date(s.getTime()+b.dur*60000);return[s,e]}
async function gPush(t){
  if(!gOn()||!settings().gcalPush||!t.block)return;
  const[s,e]=blockTimes(t.block);
  if(gBridge()){try{const r=await gas({action:'upsert',id:t.block.gid||'',title:'✅ '+t.title,start:s.toISOString(),end:e.toISOString(),desc:'Bloco de tarefa do Caderno'+(t.notes?'\n\n'+t.notes:''),task:t.id});if(r.id&&t.block){t.block.gid=r.id;save()}}catch(err){console.warn(err)}return}
  const body={summary:'✅ '+t.title,description:'Bloco de tarefa do Caderno'+(t.notes?'\n\n'+t.notes:''),start:{dateTime:s.toISOString()},end:{dateTime:e.toISOString()},extendedProperties:{private:{cadernoTask:t.id}}};
  try{const r=t.block.gid?await gApi('calendars/primary/events/'+t.block.gid,{method:'PATCH',body:JSON.stringify(body)}):await gApi('calendars/primary/events',{method:'POST',body:JSON.stringify(body)});
    if(r&&r.id&&t.block){t.block.gid=r.id;save()}}catch(e){console.warn(e);if(t.block.gid&&String(e.message).includes('404')){delete t.block.gid;gPush(t)}}
}
async function gDrop(gid){if(gid&&gBridge()){try{await gas({action:'delete',id:gid})}catch(e){}return}if(gid&&gOn())try{await gApi('calendars/primary/events/'+gid,{method:'DELETE'})}catch(e){}}
function setBlock(t,date,start,dur){t.block={...(t.block||{}),date,start,dur:dur||t.block?.dur||defDur(t)};delete t.block.auto;save();gPush(t)}
function clearBlock(t){const gid=t.block?.gid;delete t.block;save();gDrop(gid)}

/* ---- auto-encaixe ---- */
function busyFor(date,evs){
  const out=[];(evs||[]).forEach(e=>{if(e.allDay||dstr(e.start)!==date)return;out.push([e.start.getHours()*60+e.start.getMinutes(),e.end.getHours()*60+e.end.getMinutes()||1440])});
  db.tasks.forEach(t=>{if(t.block&&t.block.date===date){const s=hm2m(t.block.start);out.push([s,s+t.block.dur])}});
  return out.sort((a,b)=>a[0]-b[0]);
}
function rankTask(t){const td=today();return (t.priority==='urgente'?0:t.due&&t.due<td?1:t.priority==='alta'?2:t.status==='doing'?3:4)*100000+(t.due?Number(t.due.replace(/-/g,''))%100000:99999)}
function autoFill(date,evs){
  const st=settings();const dow=pdate(date).getDay();const td=today();
  const now=new Date();let minStart=0;if(date===td){minStart=Math.ceil((now.getHours()*60+now.getMinutes())/15)*15}
  if(date<td)return 0;
  const used=new Set();let n=0;
  const pool=db.tasks.filter(t=>t.status!=='done'&&isMine(t)&&t.tipo!=='Evento'&&(!t.block||t.block.date<td)).sort((a,b)=>rankTask(a)-rankTask(b));
  st.routine.filter(w=>w.days.includes(dow)).forEach(w=>{
    let cur=Math.max(hm2m(w.from),minStart);const end=hm2m(w.to);
    const cands=pool.filter(t=>!used.has(t.id)&&(!w.spaces.length||w.spaces.includes(t.spaceId)));
    while(cur<end){
      const busy=busyFor(date,evs);const hit=busy.find(b=>b[0]<cur+15&&b[1]>cur);
      if(hit){cur=Math.ceil(hit[1]/15)*15;continue}
      const nextB=busy.find(b=>b[0]>=cur);const gapEnd=Math.min(end,nextB?nextB[0]:end);const gap=gapEnd-cur;
      const t=cands.find(x=>!used.has(x.id)&&defDur(x)<=gap);
      if(!t){cur=nextB?Math.ceil(nextB[1]/15)*15:end;continue}
      used.add(t.id);t.block={date,start:m2hm(cur),dur:defDur(t),auto:true};n++;cur+=defDur(t);
    }
  });
  save();
  if(n&&gOn()&&settings().gcalPush)db.tasks.filter(t=>t.block?.auto&&t.block.date===date&&!t.block.gid).forEach(gPush);
  return n;
}
function undoAuto(date){db.tasks.forEach(t=>{if(t.block?.auto&&t.block.date===date)clearBlock(t)});save()}

/* ---- view ---- */
function agDays(){const a=pdate(ui.agDate||today());if(ui.agView==='day')return[a];const m=new Date(a);m.setDate(a.getDate()-((a.getDay()+6)%7));return[...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d})}
function agShift(n){const a=pdate(ui.agDate||today());a.setDate(a.getDate()+n*(ui.agView==='day'?1:7));ui.agDate=dstr(a);saveUI();render()}
function viewAgenda(){
  const days=agDays();const td=today();const st=settings();
  const f=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
  const range=days.length>1?f(days[0])+' a '+f(days[6]):days[0].toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const h=new Date().getHours();
  const banner=!st.gcalClientId?`<div class="gc-banner"><span>${I('cal','sm')}Conecte seu Google Calendar pra ver suas reuniões aqui e mandar os blocos de tarefa pra sua agenda.</span><button class="pillbtn" onclick="go('#/settings')">Conectar</button></div>`
    :!gOn()?`<div class="gc-banner"><span>${I('cal','sm')}Entre com o Google pra carregar sua agenda${gErr?' (erro: '+esc(gErr)+')':''}.</span><button class="pillbtn" onclick="gLogin()">Entrar com Google</button></div>`:'';
  const fs=ui.agSpace||'all';
  const pending=db.tasks.filter(t=>t.status!=='done'&&isMine(t)&&(!t.block||t.block.date<td)&&(fs==='all'||t.spaceId===fs)).sort((a,b)=>rankTask(a)-rankTask(b)).slice(0,60);
  return `<div class="wrap wide" style="max-width:1500px">
    <h1 class="title">${ui.agView==='day'?'Seu dia':'Sua semana'}, Juju</h1>
    <div class="ag-head">
      <div class="l"><button class="iconbtn" onclick="agShift(-1)">‹</button><button class="pillbtn">${range}</button><button class="iconbtn" onclick="agShift(1)">›</button></div>
      <div class="r">
        <button class="pillbtn light" onclick="ui.agDate=today();saveUI();render()">Hoje</button>
        <div class="tabs"><button class="${ui.agView==='day'?'on':''}" onclick="ui.agView='day';saveUI();render()">Dia</button><button class="${ui.agView!=='day'?'on':''}" onclick="ui.agView='week';saveUI();render()">Semana</button></div>
        ${gOn()?`<button class="iconbtn" title="Atualizar agenda" onclick="gCache={};render()">↻</button>`:''}
        <button class="pillbtn" onclick="agAuto()">Encaixar ${ui.agView==='day'&&ui.agDate&&ui.agDate!==td?'este dia':'meu dia'}</button>
        ${db.tasks.some(t=>t.block&&t.block.auto&&t.block.date===(ui.agView==='day'&&ui.agDate?ui.agDate:td))?`<button class="pillbtn light" onclick="undoAuto(ui.agView==='day'&&ui.agDate?ui.agDate:td);render()">Desfazer</button>`:''}
        <button class="iconbtn" title="${ui.agPanel===false?'Mostrar tarefas':'Esconder tarefas'}" onclick="ui.agPanel=!ui.agPanel;saveUI();render()">${I('tasks','sm')}</button>
      </div>
    </div>
    ${banner}
    ${window.agPicked&&db.tasks.find(x=>x.id===window.agPicked)?`<div class="pick-banner"><span>${I('target','sm')} Toque num horário pra encaixar <b>${esc(db.tasks.find(x=>x.id===window.agPicked).title)}</b></span><button class="pillbtn light" onclick="window.agPicked=null;render()">Cancelar</button></div>`:''}
    <div class="callegend" id="callegend"></div>
    <div class="ag-wrap ${ui.agPanel===false?'nopanel':''}">
      <div class="cal ${ui.agView==='day'?'':'week'}" id="cal"><div class="empty">Carregando...</div></div>
      <aside class="side-tasks">
        <h3>Pra encaixar</h3>
        <div class="hint" style="margin:0 0 8px">Arraste uma tarefa pra um horário, ou toque nela e depois no horário. Tocar num horário vazio cria uma tarefa ali.</div>
        <div class="fchips"><button class="${fs==='all'?'on':''}" onclick="ui.agSpace='all';saveUI();render()">Todas</button>${db.spaces.map(s=>`<button class="${fs===s.id?'on':''}" title="${esc(s.name)}" onclick="ui.agSpace='${s.id}';saveUI();render()"><i style="background:${spaceColor(s.id)}"></i>${esc(s.name)}</button>`).join('')}</div>
        ${pending.map(t=>`<div class="st-item ${window.agPicked===t.id?'sel':''}" draggable="true" data-task="${t.id}" onclick="agPick('${t.id}')"><button class="open" title="Abrir tarefa" onclick="event.stopPropagation();openTask('${t.id}')">abrir</button><span class="dot" style="background:${spaceColor(t.spaceId)}"></span><span style="flex:1">${esc(t.title)}<div style="margin-top:4px;display:flex;gap:4px;flex-wrap:wrap">${prioPill(t.priority)}${t.due?`<span class="pill ${t.due<td?'late':''}">${fmtDate(t.due)}</span>`:''}<span class="pill">${defDur(t)} min</span></div></span></div>`).join('')||'<div class="empty">Tudo encaixado.</div>'}
      </aside>
    </div></div>`;
}
function toggleCal(n){ui.hiddenCals=ui.hiddenCals||[];ui.hiddenCals=ui.hiddenCals.includes(n)?ui.hiddenCals.filter(x=>x!==n):[...ui.hiddenCals,n];saveUI();renderCal()}
function agPick(id){window.agPicked=window.agPicked===id?null:id;render();if(window.agPicked&&innerWidth<820)$('#cal')?.scrollIntoView({behavior:'smooth'})}
async function agAuto(){
  const date=ui.agView==='day'&&ui.agDate?ui.agDate:today();
  let evs=[];if(gOn()){try{const d=pdate(date);const e=new Date(d);e.setDate(d.getDate()+1);evs=await gLoad(d,e)}catch(e){}}
  const n=autoFill(date,evs);render();toast(n?`${n} tarefas encaixadas nos horários livres`:'Nenhum horário livre na sua rotina pra esse dia');
}
async function renderCal(){
  const el=$('#cal');if(!el)return;const days=agDays();const td=today();
  let evs=[];
  if(gOn()){try{const to=new Date(days[days.length-1]);to.setDate(to.getDate()+1);evs=await gLoad(days[0],to)}catch(e){if(e.message==='auth'){render();return}gErr=e.message}}
  if(!$('#cal'))return;
  const n=days.length,H=(AG_H1-AG_H0)*AG_PX;
  const cols=`56px repeat(${n},minmax(${n>1?110:260}px,1fr))`;
  let html=`<div class="cal-grid cal-dh" style="grid-template-columns:${cols};gap:6px"><div></div>${days.map(d=>{const ds=dstr(d);const ad=evs.filter(e=>e.allDay&&ds>=dstr(e.start)&&ds<dstr(e.end)&&!(ui.hiddenCals||[]).includes(e.cal));
    return `<div><div class="dh ${ds===td?'today':''} ${[0,6].includes(d.getDay())?'wknd':''}" onclick="ui.agView='day';ui.agDate='${ds}';saveUI();render()">${WD[d.getDay()]}<b>${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</b></div>${ad.map(e=>`<div class="pill" style="display:block;margin-top:4px;background:var(--sand);overflow:hidden;text-overflow:ellipsis">${esc(e.title)}</div>`).join('')}</div>`}).join('')}</div>`;
  html+=`<div class="cal-grid" style="grid-template-columns:${cols};gap:6px;height:${H}px"><div class="gut">${[...Array(AG_H1-AG_H0)].map((_,i)=>`<span style="top:${i*AG_PX}px">${String(AG_H0+i).padStart(2,'0')}:00</span>`).join('')}</div>`;
  const now=new Date();const nowM=now.getHours()*60+now.getMinutes();
  days.forEach(d=>{
    const ds=dstr(d);
    const items=[];
    evs.filter(e=>!e.allDay&&dstr(e.start)===ds&&!(ui.hiddenCals||[]).includes(e.cal)).forEach(e=>{const s=e.start.getHours()*60+e.start.getMinutes();let en=e.end.getHours()*60+e.end.getMinutes();if(dstr(e.end)!==ds)en=1440;items.push({k:'g',s,e:en,ev:e})});
    db.tasks.filter(t=>t.block&&t.block.date===ds).forEach(t=>{const s=hm2m(t.block.start);items.push({k:'t',s,e:s+t.block.dur,t})});
    items.sort((a,b)=>a.s-b.s||b.e-a.e);
    // colunas para sobreposição
    let cluster=[],cEnd=-1;const flush=()=>{const lanes=[];cluster.forEach(it=>{let l=lanes.findIndex(x=>x<=it.s);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=it.e;it.lane=l});cluster.forEach(it=>it.lanes=lanes.length);cluster=[]};
    items.forEach(it=>{if(it.s>=cEnd&&cluster.length)flush();cluster.push(it);cEnd=Math.max(cEnd,it.e)});flush();
    html+=`<div class="daycol" data-date="${ds}">${[...Array(AG_H1-AG_H0)].map((_,i)=>`<div class="hline" style="top:${i*AG_PX}px"></div>`).join('')}`;
    if(ds===td&&nowM>=AG_H0*60&&nowM<AG_H1*60){const y=(nowM-AG_H0*60)/60*AG_PX;html+=`<div class="nowline" style="top:${y}px">${d===days[0]||n===1||d.getDay()===1?`<span class="nowlbl">${m2hm(nowM)}</span>`:''}</div>`}
    items.forEach(it=>{
      const top=Math.max(0,(it.s-AG_H0*60)/60*AG_PX),hgt=Math.max(22,(Math.min(it.e,AG_H1*60)-Math.max(it.s,AG_H0*60))/60*AG_PX-2);
      if(it.e<=AG_H0*60||it.s>=AG_H1*60)return;
      const w=100/it.lanes,left=it.lane*w;
      const pos=`top:${top}px;height:${hgt}px;left:calc(${left}% + 1px);width:calc(${w}% - 2px)`;
      if(it.k==='g'){const e=it.ev;html+=`<div class="ev gcal" style="${pos};${e.color?`border-left:4px solid ${e.color}`:''}" onclick="window.open('${esc(e.link)}','_blank')" title="${esc(e.title)}"><div class="et"><span>${esc(e.title)}</span></div><div class="em">${m2hm(it.s)} a ${m2hm(it.e%1440)}${e.cal?' · '+esc(e.cal):''}${e.where?' · '+esc(e.where):''}</div>${e.people.length&&hgt>70?`<div class="em">👥 ${esc(e.people.slice(0,4).join(', '))}${e.people.length>4?' +'+(e.people.length-4):''}</div>`:''}</div>`}
      else{const t=it.t;const sp=space(t.spaceId);html+=`<div class="ev task ${t.status==='done'?'done':''}" draggable="true" data-task="${t.id}" style="${pos};background:${spaceColor(t.spaceId)}" onclick="openTask('${t.id}')" title="${esc(t.title)}"><div class="et"><input type="checkbox" ${t.status==='done'?'checked':''} onclick="event.stopPropagation();toggleTask('${t.id}')"><span>${esc(t.title)}</span></div>${hgt>44?`<div class="em">${t.block.start} a ${m2hm(it.e)}${t.block.auto?' · encaixe automático':''}</div>`:''}${hgt>70&&sp?`<span class="tag">${sp.icon} ${esc(sp.name)}</span>`:''}</div>`}
    });
    html+=`</div>`;
  });
  html+=`</div>`;
  el.innerHTML=html;
  const cals=[...new Map(evs.map(e=>[e.cal,e.color])).entries()].filter(([n])=>n);
  const lg=$('#callegend');if(lg)lg.innerHTML=cals.length?cals.map(([n,c])=>{const off=(ui.hiddenCals||[]).includes(n);return `<button class="${off?'':'on'}" onclick="toggleCal('${esc(n).replace(/'/g,"\\'")}')"><i style="background:${c||'#999'}"></i>${esc(n)}</button>`}).join('')+'<button class="on" style="pointer-events:none"><i style="background:var(--pink)"></i>Tarefas</button>':'';
  if(!el.dataset.scrolled){el.dataset.scrolled=1;el.scrollTop=Math.max(0,((new Date().getHours()-1)-AG_H0)*AG_PX)}
  // arrastar e soltar
  $$('[data-task]').forEach(x=>x.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',x.dataset.task);const r=x.getBoundingClientRect();x._off=x.classList.contains('ev')?e.clientY-r.top:0;window._dragOff=x._off}));
  $$('.daycol').forEach(c=>{
    const minAt=e=>{const r=c.getBoundingClientRect();const y=e.clientY-r.top-(window._dragOff||0);return Math.max(AG_H0*60,Math.min(AG_H1*60-15,AG_H0*60+Math.round(y/AG_PX*60/15)*15))};
    c.addEventListener('dragover',e=>{e.preventDefault();c.classList.add('drop')});
    c.addEventListener('dragleave',()=>c.classList.remove('drop'));
    c.addEventListener('drop',e=>{e.preventDefault();c.classList.remove('drop');const t=db.tasks.find(x=>x.id===e.dataTransfer.getData('text'));window._dragOff=0;if(!t)return;setBlock(t,c.dataset.date,m2hm(minAt(e)));render()});
    c.addEventListener('click',e=>{if(e.target!==c&&!e.target.classList.contains('hline'))return;window._dragOff=0;const m=minAt(e);
      if(window.agPicked){const t=db.tasks.find(x=>x.id===window.agPicked);window.agPicked=null;if(t){setBlock(t,c.dataset.date,m2hm(m));render();toast('Encaixada às '+m2hm(m),()=>{clearBlock(t);render()})}return}const title=prompt('Nova tarefa às '+m2hm(m)+':');if(!title)return;
      const q=parseQuick(title);const t={id:uid(),status:'todo',owner:'Juju',projectId:null,spaceId:ui.agSpace&&ui.agSpace!=='all'?ui.agSpace:db.spaces[0].id,notes:'',createdAt:Date.now(),...q};db.tasks.push(t);setBlock(t,c.dataset.date,m2hm(m));render()});
  });
}

/* ============ Caminho, ponto do dia ============ */
function caminhoN(date){let h=2166136261;for(const c of 'caminho'+date){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (Math.abs(h)%999)+1}
async function loadCaminho(){
  const el=$('#caminho');if(!el)return;const d=today();const n=caminhoN(d);const url='https://escriva.org/pt-br/camino/'+n+'/';
  const show=html=>{if($('#caminho'))$('#caminho').innerHTML=`<div class="q">${html}</div><div class="src">Caminho, ${n} · São Josemaria Escrivá · <a href="${url}" target="_blank">ler no escriva.org</a></div>`};
  let cached=null;try{cached=JSON.parse(localStorage.getItem('caderno.caminho'))}catch(e){}
  if(cached&&cached.d===d&&cached.n===n)return show(cached.h);
  show('<p style="color:var(--muted)">Carregando o ponto do dia...</p>');
  try{
    const doc=new DOMParser().parseFromString(await (await fetch(url)).text(),'text/html');
    const ps=[...doc.querySelectorAll('article .imperavi-body p')].map(p=>`<p>${esc(p.textContent.trim())}</p>`).join('');
    if(!ps)throw new Error('vazio');
    try{localStorage.setItem('caderno.caminho',JSON.stringify({d,n,h:ps}))}catch(e){}
    show(ps);
  }catch(e){show('<p>Hoje é o ponto '+n+'. Toque no link pra ler.</p>')}
}

/* ============ toast ============ */
let toastT=null;function toast(msg,undo){$$('.toast').forEach(x=>x.remove());clearTimeout(toastT);const t=document.createElement('div');t.className='toast';t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Desfazer</button>':''}`;if(undo)t.querySelector('button').onclick=()=>{t.remove();undo()};document.body.appendChild(t);toastT=setTimeout(()=>t.remove(),undo?5000:2200)}

/* ============ ligações pós-render ============ */
function afterRender(r,id){
  const q=$('#quick');
  if(q)q.addEventListener('keydown',e=>{if(e.key==='Enter'&&q.value.trim()){const extra=r==='home'||!r?{due:parseQuick(q.value).due||today()}:{};addTask(q.value,extra);q.value='';render();$('#quick').focus()}});
  if(r==='page'){
    const p=page(id);if(!p)return;
    const ti=$('#ptitle');
    ti.addEventListener('input',()=>{p.title=ti.innerText.trim();touch(p);clearTimeout(ti._t);ti._t=setTimeout(renderSide,400)});
    ti.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(p.blocks.length)focusBlock(p.blocks[0].id,false)}});
    if(p.type==='board')renderCanvas(p);else{renderBlocks(p);bindBlocks(p)}
    curPage=p;
    if(focusTitle){ti.focus();focusTitle=false}
    const pt=$('#ptask');if(pt)pt.addEventListener('keydown',e=>{if(e.key==='Enter'&&pt.value.trim()){const q=parseQuick(pt.value);db.tasks.push({id:uid(),status:'todo',projectId:p.id,spaceId:p.spaceId,notes:'',createdAt:Date.now(),...q});save();render();$('#ptask').focus()}});
  }
  if(r==='agenda')renderCal();
  if(r==='home'||!r)loadCaminho();
  if(r==='registro'){const ri=$('#regin');ri.focus();ri.addEventListener('keydown',e=>{if(e.key==='Enter'&&ri.value.trim()){db.inbox.push({id:uid(),text:ri.value.trim(),tipo:'',spaceId:'',date:today(),processed:false,createdAt:Date.now()});save();render()}})}
  if(r==='tasks'&&ui.taskView==='board'){
    $$('.card').forEach(c=>c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',c.dataset.id)}));
    $$('.col').forEach(col=>{
      col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('over')});
      col.addEventListener('dragleave',()=>col.classList.remove('over'));
      col.addEventListener('drop',e=>{e.preventDefault();const t=db.tasks.find(x=>x.id===e.dataTransfer.getData('text'));if(t){t.status=col.dataset.s;if(t.status==='done')t.doneAt=Date.now();save();render()}});
    });
  }
  if(r==='meeting'){
    const m=db.meetings.find(x=>x.id===id); const W=$('.wrap.mt'); if(!m||!W)return;
    const refreshAta=()=>{if(!m.ata){const a=$('#mata');if(a)a.value=ataText(m)}};
    const up=()=>{m.title=$('#mtitle').innerText.trim();m.date=$('#mdate').value;m.start=$('#mstart').value;m.end=$('#mend').value;m.projectId=$('#mproj').value||null;m.participants=$('#mpart').value.split(',').map(x=>x.trim()).filter(Boolean);m.place=$('#mplace').value.trim();m.summary=$('#msum').innerText;m.transcript=$('#mtr').value;save();refreshAta()};
    ['#mtitle','#msum','#mtr','#mdate','#mstart','#mend','#mproj','#mpart','#mplace'].forEach(s=>{$(s).addEventListener('input',up);$(s).addEventListener('change',up)});
    W.addEventListener('input',e=>{
      const el=e.target;
      const ai=el.closest('.ag-item'); if(ai&&el.dataset.f){m.agenda[+ai.dataset.i][el.dataset.f]=el.value;save();refreshAta();return}
      const dr=el.closest('.dec-row'); if(dr&&el.tagName==='INPUT'){m.decisions[+dr.dataset.i]=el.value;save();refreshAta();return}
      const er=el.closest('.enc-row'); if(er&&el.dataset.f){const t=db.tasks.find(x=>x.id===er.dataset.id);if(!t)return;t[el.dataset.f]=el.value;if(el.dataset.f==='status'){if(t.status==='done')t.doneAt=Date.now();er.className='enc-row '+t.status;er.querySelector('[data-act=t-done]').checked=t.status==='done'}save();refreshAta();return}
      if(el.id==='mata'){m.ata=el.value;$('#atahint').textContent='Você editou o texto, então ele não muda mais sozinho. Use Refazer pra montar de novo a partir da reunião.';save()}
    });
    W.addEventListener('click',e=>{
      const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
      const i=+(b.closest('[data-i]')?.dataset.i);const er=b.closest('.enc-row');const t=er?db.tasks.find(x=>x.id===er.dataset.id):null;
      const focusLast=sel=>{const l=$$(sel);if(l.length)l[l.length-1].focus()};
      if(a==='m-del'){if(confirm('Apagar reunião?')){db.meetings=db.meetings.filter(x=>x.id!==m.id);save();go('#/meetings')}}
      else if(a==='ag-add'){m.agenda=m.agenda||[];m.agenda.push({topic:'',notes:''});save();render();focusLast('.ag-topic')}
      else if(a==='ag-del'){if((m.agenda[i].topic||m.agenda[i].notes)&&!confirm('Remover este tema da pauta?'))return;m.agenda.splice(i,1);save();render()}
      else if(a==='dec-add'){m.decisions=m.decisions||[];m.decisions.push('');save();render();focusLast('.dec-row input')}
      else if(a==='dec-del'){m.decisions.splice(i,1);save();render()}
      else if(a==='t-done'&&t){t.status=t.status==='done'?'todo':'done';if(t.status==='done')t.doneAt=Date.now();save();render()}
      else if(a==='t-priv'&&t){t.private=!t.private;save();render()}
      else if(a==='t-open'&&t){openTask(t.id)}
      else if(a==='t-del'&&t){if(confirm('Apagar tarefa?')){db.tasks=db.tasks.filter(x=>x!==t);save();render()}}
      else if(a==='ata-regen'){if(m.ata&&!confirm('Refazer a ata descarta o que você editou no texto. Continuar?'))return;m.ata='';save();render()}
      else if(a==='ata-copy'){const v=$('#mata').value;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast('Ata copiada')).catch(()=>{$('#mata').select();document.execCommand('copy');toast('Ata copiada')})}
      else if(a==='ata-mail'){location.href='mailto:?subject='+encodeURIComponent('Ata · '+m.title+' · '+mFmtDate(m.date))+'&body='+encodeURIComponent($('#mata').value)}
    });
    const mt=$('#mtask');mt.addEventListener('keydown',e=>{if(e.key==='Enter'&&mt.value.trim()){const q=parseQuick(mt.value);db.tasks.push({id:uid(),status:'todo',owner:'Juju',projectId:m.projectId,spaceId:m.projectId?page(m.projectId).spaceId:m.spaceId,notes:'',source:m.id,createdAt:Date.now(),...q});save();render();$('#mtask').focus()}});
  }

}

render();
pull();
</script>
