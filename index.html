<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caderno</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23111'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white' font-family='Georgia'>C</text></svg>">
<style>
:root{
  --bg:#fbfaf8; --panel:#ffffff; --side:#f4f2ee; --line:#e7e4de; --text:#1d1c1a; --muted:#7a766f;
  --accent:#2f5bea; --accent-soft:#e8eeff; --hover:#ece9e3; --danger:#c43d3d;
  --todo:#8a8780; --doing:#d38b12; --done:#2c8a52;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#app{display:flex;height:100%}
/* sidebar */
#side{width:260px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#side .brand{padding:16px 16px 8px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
#side .brand .logo{width:24px;height:24px;border-radius:6px;background:#111;color:#fff;display:grid;place-items:center;font-family:Georgia;font-size:14px}
#side nav{padding:4px 8px;overflow:auto;flex:1}
.nav-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;color:var(--text);cursor:pointer;user-select:none;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:#e4e0d8;font-weight:600}
.nav-item .ic{width:20px;text-align:center;flex-shrink:0}
.nav-item .lbl{overflow:hidden;text-overflow:ellipsis;flex:1}
.nav-item .add{opacity:0;border:0;background:none;color:var(--muted);padding:0 4px;border-radius:4px}
.nav-item:hover .add{opacity:1}
.nav-item .add:hover{background:#d9d5cc}
.nav-sec{margin:16px 8px 4px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.nav-sec button{border:0;background:none;color:var(--muted);font-size:16px;line-height:1;padding:0 4px;border-radius:4px}
.nav-sec button:hover{background:var(--hover)}
.children{margin-left:14px}
#sync{padding:10px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:6px;align-items:center}
#sync .dot{width:8px;height:8px;border-radius:50%;background:#bbb}
#sync.ok .dot{background:var(--done)} #sync.busy .dot{background:var(--doing)} #sync.err .dot{background:var(--danger)}
/* main */
#main{flex:1;overflow:auto;position:relative}
.topbar{display:none}
.wrap{max-width:900px;margin:0 auto;padding:48px 56px 120px}
.wrap.wide{max-width:1200px}
h1.title{font-size:34px;line-height:1.2;margin:8px 0 6px;font-weight:700;outline:none}
h1.title:empty:before{content:attr(data-ph);color:#c4c0b8}
.page-icon{font-size:44px;cursor:pointer;display:inline-block;border-radius:8px;padding:2px}
.page-icon:hover{background:var(--hover)}
.meta{color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px}
.meta select{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 6px;font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--text);color:#fff;border-color:var(--text)}
.btn.primary:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.danger{color:var(--danger)}
h2.sec{font-size:18px;margin:36px 0 10px;display:flex;align-items:center;justify-content:space-between}
/* blocks */
.blocks{min-height:80px}
.block{position:relative;display:flex;align-items:flex-start;gap:6px;padding:1px 0}
.block .handle{position:absolute;left:-26px;top:3px;opacity:0;color:#bbb;cursor:pointer;border:0;background:none;padding:0 4px;border-radius:4px;font-size:14px}
.block:hover .handle{opacity:1}
.block .handle:hover{background:var(--hover);color:var(--text)}
.block .txt{flex:1;outline:none;min-height:1.55em;white-space:pre-wrap;word-break:break-word}
.block .txt:empty:before{content:attr(data-ph);color:#c4c0b8}
.block.p .txt:not(:focus):empty:before{content:""}
.block.h1 .txt{font-size:26px;font-weight:700;margin-top:18px;line-height:1.3}
.block.h2 .txt{font-size:20px;font-weight:650;margin-top:12px;line-height:1.35}
.block.h3 .txt{font-size:17px;font-weight:650;margin-top:8px}
.block.bullet:before{content:"•";width:18px;text-align:center;flex-shrink:0}
.block.num .n{width:22px;text-align:right;flex-shrink:0;color:var(--text)}
.block.todo input{margin:5px 2px 0 0;width:16px;height:16px;accent-color:var(--accent);flex-shrink:0}
.block.todo.checked .txt{color:var(--muted);text-decoration:line-through}
.block.quote .txt{border-left:3px solid var(--text);padding-left:12px}
.block.callout{background:#f3f1ec;border-radius:8px;padding:10px 12px;margin:4px 0}
.block.callout:before{content:"💡"}
.block.divider{padding:10px 0}
.block.divider hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.block.code .txt{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:#f3f1ec;padding:10px 12px;border-radius:8px}
.hint{color:#b5b1a9;font-size:13px;margin-top:6px}
/* slash menu */
#menu{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:6px;z-index:50;min-width:220px;max-height:320px;overflow:auto;display:none}
#menu .mi{padding:6px 10px;border-radius:6px;cursor:pointer;display:flex;gap:10px;align-items:center}
#menu .mi .k{width:22px;text-align:center;color:var(--muted)}
#menu .mi.sel,#menu .mi:hover{background:var(--hover)}
/* tasks */
.task-add{display:flex;gap:8px;margin:8px 0 16px}
.task-add input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel);outline:none}
.task-add input:focus{border-color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--side);padding:3px;border-radius:9px;width:max-content}
.tabs button{border:0;background:none;padding:4px 12px;border-radius:7px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.filters select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 8px;font-size:13px}
table.tasks{width:100%;border-collapse:collapse}
table.tasks td{border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:middle;font-size:14px}
table.tasks tr:hover td{background:#f6f4f0}
table.tasks .chk{width:28px}
table.tasks .ttl{cursor:pointer}
table.tasks tr.done .ttl{color:var(--muted);text-decoration:line-through}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:var(--side);color:var(--muted);white-space:nowrap}
.pill.todo{background:#efeeeb;color:var(--todo)} .pill.doing{background:#e3ecff;color:var(--accent)} .pill.waiting{background:#fdf1dc;color:var(--doing)} .pill.done{background:#e1f2e8;color:var(--done)}
.pill.urgente{background:#c43d3d;color:#fff} .pill.alta{background:#fde9dc;color:#c0601a} .pill.late{background:#fde4e4;color:var(--danger)}
.pill.tipo{background:#f1eef8;color:#6b54a8}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:3px 12px;font-size:13px;color:var(--muted)}
.chips button.on{background:var(--text);border-color:var(--text);color:#fff}
.group-h{font-size:13px;font-weight:650;color:var(--muted);margin:22px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.group-h.red{color:var(--danger)}
.pulse{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.pulse .pc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.pulse .pc:hover{border-color:#cfcac0}
.pulse .pc b{font-size:22px;display:block}
.pulse .pc small{color:var(--muted)}
.pill.src{background:var(--accent-soft);color:var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;align-items:start;overflow-x:auto}
.col{background:var(--side);border-radius:var(--radius);padding:10px;min-height:120px}
.col h3{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between;color:var(--muted)}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:8px;cursor:grab;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card:hover{border-color:#cfcac0}
.card .sub{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:14px;padding:14px 4px}
/* drawer */
#drawer{position:fixed;top:0;right:0;width:440px;max-width:100%;height:100%;background:var(--panel);border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.08);z-index:40;transform:translateX(105%);transition:transform .18s ease;overflow:auto;padding:28px}
#drawer.open{transform:none}
.field{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:14px}
.field label{width:100px;color:var(--muted);flex-shrink:0}
.field input,.field select{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--panel)}
textarea.notes{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;background:var(--panel);outline:none}
/* home */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.box h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f0eee9;font-size:14px;cursor:pointer}
.row:last-child{border-bottom:0}
.row .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* brainstorm */
.canvas{position:relative;height:calc(100vh - 230px);min-height:500px;background:#fdfcfa;border:1px solid var(--line);border-radius:var(--radius);overflow:auto;background-image:radial-gradient(#e3dfd8 1px,transparent 1px);background-size:22px 22px}
.sticky{position:absolute;width:190px;min-height:120px;padding:10px 12px 12px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:14px;display:flex;flex-direction:column}
.sticky .bar{height:14px;cursor:move;margin:-4px -6px 4px;display:flex;justify-content:flex-end;gap:4px}
.sticky .bar button{border:0;background:none;font-size:12px;opacity:.0;padding:0 3px}
.sticky:hover .bar button{opacity:.6}
.sticky .txt{outline:none;flex:1;white-space:pre-wrap;word-break:break-word}
.c-yellow{background:#fff3b8}.c-pink{background:#ffd9e4}.c-blue{background:#d8e8ff}.c-green{background:#d7f3dd}.c-orange{background:#ffe2c4}.c-white{background:#fff;border:1px solid var(--line)}
/* meetings */
.mt-sum{white-space:pre-wrap}
.decision{padding:6px 10px;border-left:3px solid var(--done);background:#f2f9f4;margin:6px 0;border-radius:0 6px 6px 0;font-size:14px}
/* settings */
.set label{display:block;font-size:13px;color:var(--muted);margin:14px 0 4px}
.set input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel)}
.note{background:#f3f1ec;border-radius:8px;padding:12px 14px;font-size:14px;color:#55524c}
/* search */
#search{position:fixed;inset:0;background:rgba(20,20,20,.25);z-index:60;display:none;align-items:flex-start;justify-content:center;padding-top:12vh}
#search .sb{background:var(--panel);width:560px;max-width:92vw;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.2);overflow:hidden}
#search input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:17px;outline:none}
#search .res{max-height:50vh;overflow:auto;padding:6px}
#search .r{padding:8px 12px;border-radius:7px;cursor:pointer;display:flex;gap:10px}
#search .r.sel,#search .r:hover{background:var(--hover)}
#search .r .t{color:var(--muted);font-size:12px;margin-left:auto}
/* mobile */
@media (max-width:820px){
  #side{position:fixed;z-index:45;height:100%;transform:translateX(-100%);transition:transform .18s}
  #side.open{transform:none;box-shadow:10px 0 30px rgba(0,0,0,.15)}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .wrap{padding:20px 16px 100px}
  .grid2{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  h1.title{font-size:28px}
  .block .handle{display:none}
}
/* ===== tema v2: creme, menu preto, cards pastel ===== */
:root{
  --bg:#f7f1e7; --panel:#fffdf9; --card:#efe8dc; --side:#141414; --line:#e4dccd; --text:#161616; --muted:#857d70;
  --accent:#161616; --accent-soft:#f4d9e7; --hover:#ebe3d5;
  --pink:#f4b8d6; --blue:#b9c9ec; --yellow:#f5d77a; --green:#c9e2b8; --sand:#e6dccb;
  --radius:22px;
}
html,body{font-family:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg)}
#app{padding:16px;gap:20px;height:100vh}
#side{background:var(--side);color:#e9e5dd;border:0;border-radius:26px;width:240px}
#side .brand{color:#fff;font-size:26px;font-weight:600;letter-spacing:-.02em;padding:26px 24px 18px}
#side .brand .logo{display:none}
#side nav{padding:4px 12px}
.nav-item{color:#d6d1c8;padding:7px 12px;border-radius:12px;font-size:14.5px}
.nav-item:hover{background:#262626}
.nav-item.active{background:#262626;color:var(--pink);font-weight:500}
.nav-item .add{color:#8c867c}.nav-item .add:hover{background:#333}
.nav-sec{color:#8c867c;text-transform:none;letter-spacing:0;font-weight:500;font-size:13px;margin:18px 12px 6px}
.nav-sec button{color:#8c867c}.nav-sec button:hover{background:#262626}
#sync{border-top:1px solid #262626;color:#8c867c;padding:14px 24px}
#main{background:var(--bg);border-radius:0}
.wrap{padding:28px 32px 120px}
h1.title{font-size:40px;font-weight:600;letter-spacing:-.03em}
.btn{border-radius:999px;border-color:var(--line);background:var(--panel)}
.btn.primary{background:#161616;border-color:#161616}
.task-add input,.set input,.field input,.field select,.filters select,.meta select,textarea.notes{border-radius:999px;border-color:#d9cfbf;background:var(--panel)}
textarea.notes{border-radius:18px}
.task-add input{padding:11px 18px}
.tabs{background:transparent;padding:0;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;color:var(--text);padding:5px 14px}
.tabs button.on{background:#161616;color:#fff;border-color:#161616;box-shadow:none}
.chips button.on{background:#161616}
.box{background:var(--card);border:0;border-radius:var(--radius);padding:18px 20px}
.box h3{color:var(--text);font-size:17px;font-weight:600}
.row{border-bottom:1px solid #e2d9ca}
.col{background:var(--card);border-radius:var(--radius)}
.card{border:0;border-radius:16px;background:var(--panel);box-shadow:none}
table.tasks{background:var(--card);border-radius:var(--radius);overflow:hidden}
table.tasks td{border-bottom:1px solid #e2d9ca}
table.tasks tr:hover td{background:#e8e0d2}
.pill{border-radius:999px}
.pill.urgente{background:#161616;color:#fff}.pill.alta{background:var(--pink);color:#161616}
.pill.waiting{background:var(--yellow);color:#161616}.pill.doing{background:var(--blue);color:#161616}.pill.done{background:var(--green);color:#161616}
.pulse .pc{border:0;border-radius:var(--radius);padding:16px 18px}
.pulse .pc b{font-size:34px;font-weight:600;letter-spacing:-.02em}
.stat{border-radius:var(--radius);padding:18px 20px;cursor:pointer}
.stat h4{margin:0 0 6px;font-size:18px;font-weight:600}
.stat b{font-size:38px;font-weight:600;letter-spacing:-.02em;display:block}
.stat small{color:#3d3a35}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 22px}
.grid2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.note{background:var(--card);border-radius:18px}
#drawer{border-radius:26px 0 0 26px;background:var(--bg)}
/* ===== agenda ===== */
.ag-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.ag-head .l,.ag-head .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pillbtn{border:0;background:#161616;color:#fff;border-radius:999px;padding:8px 16px;font-size:14px}
.pillbtn.light{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.pillbtn.pink{background:var(--pink);color:#161616}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel)}
.ag-wrap{display:grid;grid-template-columns:1fr 290px;gap:18px;align-items:start}
.cal{overflow:auto;max-height:calc(100vh - 190px);border-radius:var(--radius)}
.cal-grid{display:grid;position:relative;min-width:720px}
.cal-dh{position:sticky;top:0;z-index:4;background:var(--bg);padding-bottom:8px}
.dh{background:var(--panel);border-radius:16px;text-align:center;padding:8px 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);cursor:pointer}
.dh b{display:block;font-size:20px;letter-spacing:-.01em;color:var(--text);text-transform:none;font-weight:500}
.dh.today{background:#161616;color:#cfc9bf}.dh.today b{color:#fff}
.dh.wknd{opacity:.65}
.gut{font-size:12px;color:var(--muted);text-align:right;padding-right:8px;position:relative}
.gut span{position:absolute;right:8px;transform:translateY(-50%)}
.daycol{position:relative;border-left:1px dashed #e0d6c6}
.daycol.drop{background:rgba(244,184,214,.18)}
.hline{position:absolute;left:0;right:0;border-top:1px solid #ece4d6}
.nowline{position:absolute;left:0;right:0;border-top:2px dashed #161616;z-index:3;pointer-events:none}
.nowlbl{position:absolute;left:-52px;transform:translateY(-50%);background:var(--pink);font-size:11px;font-weight:600;border-radius:999px;padding:1px 7px;z-index:3}
.ev{position:absolute;border-radius:14px;padding:7px 9px;font-size:12.5px;overflow:hidden;cursor:pointer;line-height:1.3;border:2px solid var(--bg)}
.ev .et{font-weight:600;font-size:13.5px;letter-spacing:-.01em;display:flex;gap:6px;align-items:flex-start}
.ev .et input{margin:2px 0 0;accent-color:#161616}
.ev .em{color:#4a463f;margin-top:2px}
.ev.done .et span{text-decoration:line-through;opacity:.6}
.ev.gcal{background:var(--sand)}
.ev.task{cursor:grab}
.ev .tag{display:inline-block;background:rgba(255,255,255,.6);border-radius:999px;padding:0 7px;font-size:11px;margin-top:4px}
.side-tasks{background:var(--card);border-radius:var(--radius);padding:16px;max-height:calc(100vh - 190px);overflow:auto}
.side-tasks h3{margin:0 0 4px;font-size:17px}
.st-item{background:var(--panel);border-radius:14px;padding:8px 10px;margin:8px 0;font-size:13px;cursor:grab;display:flex;gap:8px;align-items:flex-start}
.st-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
.st-item:hover{outline:1px solid #d9cfbf}
.gc-banner{background:var(--yellow);border-radius:18px;padding:12px 16px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (max-width:820px){
  #app{padding:0;gap:0}
  #side{border-radius:0}
  .ag-wrap{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  h1.title{font-size:30px}
}
.caminho{background:var(--panel);border-radius:var(--radius);padding:18px 22px;margin:0 0 22px;display:flex;gap:16px;align-items:flex-start}
.caminho .n{background:#161616;color:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.caminho .q{font-size:16px;line-height:1.6;flex:1}
.caminho .q p{margin:0 0 6px}
.caminho .src{font-size:12px;color:var(--muted)}
.caminho .src a{text-decoration:underline}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div id="drawer"></div>
<div id="menu"></div>
<div id="search"><div class="sb"><input placeholder="Buscar páginas, tarefas, reuniões..."><div class="res"></div></div></div>

<script>
/* ============ estado ============ */
const LS_DATA='caderno.data', LS_CFG='caderno.cfg';
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];

function seed(){
  const blub='sp_blub', pes='sp_pessoal';
  const p1=uid(), p2=uid(), b1=uid();
  return {version:1,
    spaces:[{id:blub,name:'Blub',icon:'💧'},{id:pes,name:'Pessoal',icon:'🌿'}],
    pages:[
      {id:p1,spaceId:blub,parentId:null,type:'project',title:'Lançamento Blub+',icon:'🚀',status:'ativo',updatedAt:Date.now(),
       blocks:[{id:uid(),type:'h2',text:'Objetivo'},{id:uid(),type:'p',text:'Escreva aqui o objetivo do projeto.'},{id:uid(),type:'h2',text:'Links'},{id:uid(),type:'bullet',text:''}]},
      {id:p2,spaceId:pes,parentId:null,type:'page',title:'Bem-vinda ao Caderno',icon:'👋',updatedAt:Date.now(),
       blocks:[
        {id:uid(),type:'p',text:'Este é o seu caderno. Tudo que você escrever aqui é salvo sozinho.'},
        {id:uid(),type:'h2',text:'Atalhos do editor'},
        {id:uid(),type:'bullet',text:'Digite / para abrir o menu de blocos'},
        {id:uid(),type:'bullet',text:'# espaço vira título, ## vira subtítulo'},
        {id:uid(),type:'bullet',text:'[] espaço vira checklist, - espaço vira lista'},
        {id:uid(),type:'bullet',text:'Cmd+K busca qualquer coisa'},
        {id:uid(),type:'todo',text:'Conectar ao GitHub em Configurações',checked:false}]},
      {id:b1,spaceId:blub,parentId:null,type:'board',title:'Ideias de sabores',icon:'💡',updatedAt:Date.now(),blocks:[],
       cards:[{id:uid(),text:'Maracujá com hortelã',color:'yellow',x:40,y:40},{id:uid(),text:'Linha funcional com magnésio',color:'blue',x:270,y:70}]}
    ],
    tasks:[{id:uid(),title:'Fechar data de lançamento do Blub+',status:'todo',projectId:p1,spaceId:blub,due:today(),priority:'alta',notes:'',createdAt:Date.now()}],
    meetings:[]
  };
}
let db, cfg;
try{db=JSON.parse(localStorage.getItem(LS_DATA))}catch(e){}
try{cfg=JSON.parse(localStorage.getItem(LS_CFG))||{}}catch(e){cfg={}}
if(!db||!db.pages) db=seed();
function migrate(){
  db.meetings=db.meetings||[]; db.tasks=db.tasks||[]; db.inbox=db.inbox||[];
  db.tasks.forEach(t=>{if(t.priority==='média'||!t.priority)t.priority='normal'});
}
migrate();
let ui={expanded:{}, taskView:'board', taskFilter:{space:'all',project:'all',status:'open'}};
try{Object.assign(ui,JSON.parse(localStorage.getItem('caderno.ui'))||{})}catch(e){}
const saveUI=()=>{try{localStorage.setItem('caderno.ui',JSON.stringify(ui))}catch(e){}};

/* ============ sync com GitHub ============ */
let sha=null, saveTimer=null, dirty=false, syncing=false;
function setSync(state,msg){const el=$('#sync');if(!el)return;el.className=state;el.querySelector('span').textContent=msg}
function b64enc(str){const bytes=new TextEncoder().encode(str);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(b64){const bin=atob(b64.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
const ghOn=()=>cfg.owner&&cfg.repo&&cfg.token;
async function gh(method,body){
  const url=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`;
  const r=await fetch(url+(method==='GET'?'?t='+Date.now():''),{method,headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
  return r;
}
async function pull(){
  if(!ghOn()){setSync('','Só neste navegador');return}
  setSync('busy','Carregando...');
  try{
    const r=await gh('GET');
    if(r.status===404){sha=null;await push(true);return}
    if(!r.ok)throw new Error('GitHub respondeu '+r.status);
    const j=await r.json(); sha=j.sha;
    let content=j.content;
    if(!content&&j.download_url===null)throw new Error('arquivo vazio');
    if(!content||j.encoding==='none'){ // arquivos > 1MB
      const raw=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/git/blobs/${j.sha}`,{headers:{Authorization:'Bearer '+cfg.token}}).then(x=>x.json());content=raw.content}
    const remote=JSON.parse(b64dec(content));
    if(remote&&remote.pages){db=remote;migrate();localStorage.setItem(LS_DATA,JSON.stringify(db))}
    setSync('ok','Salvo no GitHub'); render();
  }catch(e){console.error(e);setSync('err','Erro: '+e.message)}
}
async function push(force){
  if(!ghOn())return;
  if(syncing){dirty=true;return}
  syncing=true;dirty=false;setSync('busy','Salvando...');
  try{
    const body={message:'caderno: '+new Date().toLocaleString('pt-BR'),content:b64enc(JSON.stringify(db,null,1))};
    if(sha)body.sha=sha;
    let r=await gh('PUT',body);
    if(r.status===409||r.status===422){ // sha desatualizado: pega o atual e regrava
      const g=await gh('GET'); if(g.ok){sha=(await g.json()).sha;body.sha=sha;r=await gh('PUT',body)}
    }
    if(!r.ok)throw new Error('GitHub respondeu '+r.status);
    sha=(await r.json()).content.sha; setSync('ok','Salvo no GitHub');
  }catch(e){console.error(e);setSync('err','Erro ao salvar: '+e.message);dirty=true}
  syncing=false; if(dirty)schedule();
}
function schedule(){clearTimeout(saveTimer);saveTimer=setTimeout(push,1200)}
function save(){
  localStorage.setItem(LS_DATA,JSON.stringify(db));
  if(ghOn()){setSync('busy','Alterado...');schedule()}
}
window.addEventListener('beforeunload',e=>{if(ghOn()&&(dirty||saveTimer&&syncing)){e.preventDefault()}});
window.addEventListener('focus',()=>{if(ghOn()&&!syncing&&!dirty&&!document.activeElement?.isContentEditable)pullQuiet()});
async function pullQuiet(){ // checa se mudou em outro aparelho (ou se a Jaque gravou reuniões)
  try{const r=await gh('GET');if(!r.ok)return;const j=await r.json();if(j.sha!==sha){await pull()}}catch(e){}
}

/* ============ helpers de dados ============ */
const page=id=>db.pages.find(p=>p.id===id);
const space=id=>db.spaces.find(s=>s.id===id);
const projects=()=>db.pages.filter(p=>p.type==='project');
const statusLbl={todo:'A fazer',doing:'Fazendo',waiting:'Aguardando',done:'Feito'};
const PRIOS=['urgente','alta','normal','baixa'];
const TIPOS=['Pontual','Projeto','Recorrente','Lembrete','Evento'];
const prioPill=p=>p==='urgente'?'<span class="pill urgente">urgente</span>':p==='alta'?'<span class="pill alta">alta</span>':'';
const fmtDate=d=>{if(!d)return'';const[y,m,dd]=d.split('-');return dd+'/'+m};
const typeLbl={page:'Página',project:'Projeto',board:'Brainstorm',process:'Processo'};
const typeIcon={page:'📄',project:'📁',board:'💡',process:'🔁'};

function newPage(spaceId,type='page',parentId=null){
  const p={id:uid(),spaceId,parentId,type,title:'',icon:typeIcon[type],updatedAt:Date.now(),blocks:[{id:uid(),type:'p',text:''}]};
  if(type==='project'){p.status='ativo';p.blocks=[{id:uid(),type:'h2',text:'Objetivo'},{id:uid(),type:'p',text:''},{id:uid(),type:'h2',text:'Notas'},{id:uid(),type:'p',text:''}]}
  if(type==='board'){p.cards=[];p.blocks=[]}
  if(type==='process'){p.blocks=[{id:uid(),type:'callout',text:'Quando usar este processo:'},{id:uid(),type:'h2',text:'Passo a passo'},{id:uid(),type:'num',text:''},{id:uid(),type:'h2',text:'Responsável'},{id:uid(),type:'p',text:''}]}
  db.pages.push(p); if(parentId)ui.expanded[parentId]=true; save(); go('#/page/'+p.id,true);
}
function deletePage(id){
  const kids=db.pages.filter(p=>p.parentId===id);kids.forEach(k=>deletePage(k.id));
  db.pages=db.pages.filter(p=>p.id!==id);
  db.tasks.forEach(t=>{if(t.projectId===id)t.projectId=null});
}

/* ============ roteamento ============ */
let focusTitle=false;
function go(h,focus){focusTitle=!!focus;location.hash=h}
window.addEventListener('hashchange',render);

function render(){
  renderSide();
  const h=location.hash||'#/home';const [_,r,id]=h.split('/');
  closeDrawer(true);
  const main=$('#main');
  const top=`<div class="topbar"><button class="btn ghost" onclick="$('#side').classList.toggle('open')">☰</button><b>Caderno</b></div>`;
  let html='';
  if(r==='page'&&page(id))html=viewPage(page(id));
  else if(r==='tasks')html=viewTasks();
  else if(r==='meetings')html=viewMeetings();
  else if(r==='registro')html=viewRegistro();
  else if(r==='agenda')html=viewAgenda();
  else if(r==='meeting'&&db.meetings.find(m=>m.id===id))html=viewMeeting(db.meetings.find(m=>m.id===id));
  else if(r==='settings')html=viewSettings();
  else html=viewHome();
  main.innerHTML=top+html; main.scrollTop=0;
  $('#side').classList.remove('open');
  afterRender(r,id);
}

/* ============ sidebar ============ */
function renderSide(){
  const h=location.hash||'#/home';
  const item=(href,ic,lbl)=>`<a class="nav-item ${h===href?'active':''}" href="${href}"><span class="ic">${ic}</span><span class="lbl">${lbl}</span></a>`;
  const tree=(spaceId,parentId)=>db.pages.filter(p=>p.spaceId===spaceId&&p.parentId===parentId&&p.type!=='project').map(p=>{
    const kids=db.pages.some(k=>k.parentId===p.id);
    return `<div class="nav-item ${h==='#/page/'+p.id?'active':''}" onclick="go('#/page/${p.id}')">
      <span class="ic" onclick="event.stopPropagation();toggleExp('${p.id}')">${kids?(ui.expanded[p.id]?'▾':'▸'):p.icon||'📄'}</span>
      <span class="lbl">${kids?(p.icon||'')+' ':''}${esc(p.title||'Sem título')}</span>
      <button class="add" title="Subpágina" onclick="event.stopPropagation();newPage('${spaceId}','page','${p.id}')">+</button></div>
      ${kids&&ui.expanded[p.id]?`<div class="children">${tree(spaceId,p.id)}</div>`:''}`}).join('');
  const projs=sp=>db.pages.filter(p=>p.spaceId===sp&&p.type==='project'&&p.status!=='arquivado').map(p=>
    `<div class="nav-item ${h==='#/page/'+p.id?'active':''}" onclick="go('#/page/${p.id}')"><span class="ic">${p.icon||'📁'}</span><span class="lbl">${esc(p.title||'Sem título')}</span>
     <button class="add" title="Subpágina" onclick="event.stopPropagation();newPage('${sp}','page','${p.id}')">+</button></div>
     ${db.pages.some(k=>k.parentId===p.id)?`<div class="children">${tree(sp,p.id)}</div>`:''}`).join('');
  $('#side').innerHTML=`
    <div class="brand"><span class="logo">C</span>Caderno</div>
    <nav>
      <div class="nav-item" onclick="openSearch()"><span class="ic">🔍</span><span class="lbl">Buscar</span><span style="color:var(--muted);font-size:12px">⌘K</span></div>
      ${item('#/home','🏠','Início')}
      ${item('#/agenda','📅','Agenda')}
      ${item('#/tasks','✅','Tarefas')}
      ${item('#/meetings','🎙️','Reuniões')}
      ${item('#/registro','📥','Registro do dia'+(db.inbox.filter(i=>!i.processed).length?' ('+db.inbox.filter(i=>!i.processed).length+')':''))}
      ${db.spaces.map(s=>`
        <div class="nav-sec"><span>${s.icon} ${esc(s.name)}</span><button title="Nova página" onclick="newMenu(event,'${s.id}')">+</button></div>
        ${projs(s.id)}
        ${tree(s.id,null)}
      `).join('')}
      <div style="height:12px"></div>
      ${item('#/settings','⚙️','Configurações')}
    </nav>
    <div id="sync"><span class="dot"></span><span>${ghOn()?'Conectado':'Só neste navegador'}</span></div>`;
}
function toggleExp(id){ui.expanded[id]=!ui.expanded[id];saveUI();renderSide()}
function newMenu(e,spaceId){
  e.stopPropagation();
  showMenu(e.target.getBoundingClientRect(),[
    {k:'📄',l:'Página',f:()=>newPage(spaceId,'page')},
    {k:'📁',l:'Projeto',f:()=>newPage(spaceId,'project')},
    {k:'🔁',l:'Processo',f:()=>newPage(spaceId,'process')},
    {k:'💡',l:'Brainstorm',f:()=>newPage(spaceId,'board')}]);
}

/* ============ menu genérico ============ */
let menuItems=[],menuSel=0,menuCb=null;
function showMenu(rect,items){
  menuItems=items;menuSel=0;const m=$('#menu');
  m.innerHTML=items.map((it,i)=>`<div class="mi ${i===0?'sel':''}" data-i="${i}"><span class="k">${it.k}</span>${it.l}</div>`).join('');
  m.style.display='block';
  const top=Math.min(rect.bottom+4,innerHeight-m.offsetHeight-8);
  m.style.top=top+'px';m.style.left=Math.min(rect.left,innerWidth-240)+'px';
  $$('.mi',m).forEach(el=>el.onmousedown=ev=>{ev.preventDefault();const it=menuItems[+el.dataset.i];hideMenu();it.f()});
}
function hideMenu(){$('#menu').style.display='none';menuItems=[]}
document.addEventListener('mousedown',e=>{if(!e.target.closest('#menu'))hideMenu()});

/* ============ início ============ */
function viewHome(){
  const t=today(); const fs=ui.homeSpace||'all';
  const inSp=x=>fs==='all'||x.spaceId===fs;
  const open=db.tasks.filter(x=>x.status!=='done');
  const mine=open.filter(inSp);
  const urg=mine.filter(x=>x.priority==='urgente'||(x.due&&x.due<t)).sort(taskSort);
  const tod=mine.filter(x=>x.due===t&&x.priority!=='urgente');
  const prio=mine.filter(x=>x.priority==='alta'&&!urg.includes(x)&&!tod.includes(x)).sort(taskSort).slice(0,12);
  const waiting=mine.filter(x=>x.status==='waiting').sort(taskSort);
  const mts=[...db.meetings].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5);
  const inboxN=db.inbox.filter(i=>!i.processed).length;
  const h=new Date().getHours();
  const hi=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';
  const trow=x=>{const sp=space(x.spaceId);return `<div class="row" onclick="openTask('${x.id}')"><input type="checkbox" onclick="event.stopPropagation();toggleTask('${x.id}')"><span class="grow">${esc(x.title)}</span>${fs==='all'&&sp?`<span title="${esc(sp.name)}">${sp.icon}</span>`:''}${prioPill(x.priority)}${x.due?`<span class="pill ${x.due<t?'late':''}">${fmtDate(x.due)}</span>`:''}</div>`};
  const pulse=db.spaces.map(s=>{const o=open.filter(x=>x.spaceId===s.id);const u=o.filter(x=>x.priority==='urgente'||(x.due&&x.due<t)).length;
    return `<div class="pc" style="background:${spaceColor(s.id)}" onclick="ui.homeSpace='${s.id}';saveUI();render()"><small>${s.icon} ${esc(s.name)}</small><b>${o.length}</b><small>${u?`<span style="color:var(--danger)">${u} urgentes/atrasadas</span>`:'em dia'}</small></div>`}).join('');
  return `<div class="wrap wide">
    <h1 class="title">${hi}, Juju</h1>
    <div class="meta">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})} · ${open.length} tarefas abertas${inboxN?` · <a href="#/registro" style="color:var(--accent)">${inboxN} no registro pra processar</a>`:''}</div>
    <div class="caminho" id="caminho"></div>
    <div class="stats">
      <div class="stat" style="background:var(--pink)" onclick="ui.taskView='agenda';saveUI();go('#/tasks')"><h4>🔥 Urgentes e atrasadas</h4><b>${open.filter(x=>x.priority==='urgente'||(x.due&&x.due<t)).length}</b><small>tarefas pedindo atenção</small></div>
      <div class="stat" style="background:var(--blue)" onclick="ui.taskView='board';saveUI();go('#/tasks')"><h4>⚡ Fazendo agora</h4><b>${open.filter(x=>x.status==='doing').length}</b><small>em andamento</small></div>
      <div class="stat" style="background:var(--yellow)" onclick="go('#/agenda')"><h4>📅 Encaixadas hoje</h4><b>${db.tasks.filter(x=>x.block&&x.block.date===t).length}</b><small>blocos na agenda de hoje</small></div>
    </div>
    <div class="pulse">${pulse}</div>
    <div class="chips"><button class="${fs==='all'?'on':''}" onclick="ui.homeSpace='all';saveUI();render()">Todas as frentes</button>${db.spaces.map(s=>`<button class="${fs===s.id?'on':''}" onclick="ui.homeSpace='${s.id}';saveUI();render()">${s.icon} ${esc(s.name)}</button>`).join('')}</div>
    <div class="task-add"><input id="quick" placeholder="Nova tarefa para hoje... (Enter)"></div>
    <div class="grid2">
      <div class="box"><h3>🔥 Alertas: urgentes e atrasadas</h3>${urg.map(trow).join('')||'<div class="empty">Nada pegando fogo.</div>'}</div>
      <div class="box"><h3>📌 Minhas prioridades</h3>${[...tod,...prio].map(trow).join('')||'<div class="empty">Sem prioridade alta aberta.</div>'}</div>
      <div class="box"><h3>⏳ Aguardando alguém</h3>${waiting.map(trow).join('')||'<div class="empty">Nada parado esperando.</div>'}</div>
      <div class="box"><h3>🎙️ Reuniões recentes</h3>${mts.map(m=>`<div class="row" onclick="go('#/meeting/${m.id}')"><span class="grow">${esc(m.title)}</span><span class="pill">${fmtDate(m.date)}</span></div>`).join('')||'<div class="empty">Nenhuma reunião ainda.</div>'}</div>
    </div></div>`;
}

/* ============ registro do dia ============ */
const REG_TIPOS=['Ideia','Recado','Reunião','Aprendizado','Outro'];
function viewRegistro(){
  const items=[...db.inbox].sort((a,b)=>(a.processed-b.processed)||b.createdAt-a.createdAt);
  return `<div class="wrap">
    <h1 class="title">📥 Registro do dia</h1>
    <div class="meta">Despeja tudo aqui na hora, sem pensar. No fim do dia, processa: vira tarefa ou marca como processado.</div>
    <div class="task-add"><input id="regin" placeholder="Anota qualquer coisa... (Enter)"></div>
    ${items.map(i=>{const sp=space(i.spaceId);return `<div class="row" style="cursor:default;${i.processed?'opacity:.5':''}">
      <span class="grow" style="white-space:normal">${esc(i.text)}</span>
      <select onchange="regSet('${i.id}','tipo',this.value)" style="font-size:12px;border:1px solid var(--line);border-radius:6px"><option value="">tipo</option>${REG_TIPOS.map(x=>`<option ${i.tipo===x?'selected':''}>${x}</option>`).join('')}</select>
      <select onchange="regSet('${i.id}','spaceId',this.value)" style="font-size:12px;border:1px solid var(--line);border-radius:6px"><option value="">frente</option>${db.spaces.map(s=>`<option value="${s.id}" ${i.spaceId===s.id?'selected':''}>${s.icon} ${esc(s.name)}</option>`).join('')}</select>
      <span class="pill">${fmtDate(i.date)}</span>
      ${i.taskId?'<span class="pill src">virou tarefa</span>':`<button class="btn ghost" onclick="regToTask('${i.id}')">→ tarefa</button>`}
      <input type="checkbox" title="Processado" ${i.processed?'checked':''} onchange="regSet('${i.id}','processed',this.checked);render()">
    </div>`}).join('')||'<div class="empty">Registro vazio.</div>'}
  </div>`;
}
function regSet(id,k,v){const i=db.inbox.find(x=>x.id===id);i[k]=v;save()}
function regToTask(id){const i=db.inbox.find(x=>x.id===id);const t={id:uid(),title:i.text,status:'todo',projectId:null,spaceId:i.spaceId||db.spaces[0].id,due:'',priority:'normal',notes:'Veio do registro do dia',createdAt:Date.now()};db.tasks.push(t);i.taskId=t.id;i.processed=true;save();render();openTask(t.id)}

/* ============ página ============ */
function viewPage(p){
  const sp=space(p.spaceId);
  const crumbs=[];let c=p;while(c.parentId){c=page(c.parentId);if(!c)break;crumbs.unshift(`<a href="#/page/${c.id}">${esc(c.title||'Sem título')}</a>`)}
  let extra='';
  if(p.type==='project'){
    const ts=db.tasks.filter(t=>t.projectId===p.id);
    const done=ts.filter(t=>t.status==='done').length;
    const mts=db.meetings.filter(m=>m.projectId===p.id);
    extra=`<h2 class="sec"><span>Tarefas <span class="pill">${done}/${ts.length}</span></span></h2>
      <div class="task-add"><input id="ptask" placeholder="Nova tarefa do projeto... (Enter)"></div>
      ${taskTable(ts.sort(taskSort))}
      <h2 class="sec">Reuniões</h2>
      ${mts.map(m=>`<div class="row" onclick="go('#/meeting/${m.id}')"><span>🎙️</span><span class="grow">${esc(m.title)}</span><span class="pill">${fmtDate(m.date)}</span></div>`).join('')||'<div class="empty">Nenhuma reunião ligada a este projeto.</div>'}`;
  }
  const kids=db.pages.filter(k=>k.parentId===p.id);
  const kidsHtml=kids.length?`<h2 class="sec">Subpáginas</h2>${kids.map(k=>`<div class="row" onclick="go('#/page/${k.id}')"><span>${k.icon||'📄'}</span><span class="grow">${esc(k.title||'Sem título')}</span></div>`).join('')}`:'';
  const body=p.type==='board'
    ?`<div style="display:flex;gap:8px;margin-bottom:10px">${['yellow','pink','blue','green','orange','white'].map(c=>`<button class="btn" onclick="addSticky('${c}')"><span class="c-${c}" style="display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px"></span></button>`).join('')}<span class="hint" style="margin-left:6px;align-self:center">Clique numa cor para criar um post-it. Arraste pela barra de cima.</span></div><div class="canvas" id="canvas"></div>`
    :`<div class="blocks" id="blocks"></div><div class="hint">Digite / para inserir blocos</div>`;
  return `<div class="wrap ${p.type==='board'?'wide':''}">
    <div class="meta">${sp?sp.icon+' '+esc(sp.name):''}${crumbs.length?' / '+crumbs.join(' / '):''}</div>
    <span class="page-icon" onclick="pickIcon('${p.id}',this)">${p.icon||'📄'}</span>
    <h1 class="title" contenteditable="true" data-ph="Sem título" id="ptitle">${esc(p.title)}</h1>
    <div class="meta">
      <span class="pill">${typeLbl[p.type]}</span>
      <select onchange="movePage('${p.id}',this.value)">${db.spaces.map(s=>`<option value="${s.id}" ${s.id===p.spaceId?'selected':''}>${s.icon} ${esc(s.name)}</option>`).join('')}</select>
      ${p.type==='project'?`<select onchange="page('${p.id}').status=this.value;save();renderSide()">${['ativo','pausado','concluído','arquivado'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select>`:''}
      <span>Editado ${new Date(p.updatedAt).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</span>
      <button class="btn ghost" onclick="newPage('${p.spaceId}','page','${p.id}')">+ Subpágina</button>
      <button class="btn ghost danger" onclick="if(confirm('Apagar esta página e as subpáginas?')){deletePage('${p.id}');save();go('#/home')}">Apagar</button>
    </div>
    ${body}${kidsHtml}${extra}</div>`;
}
function movePage(id,sp){const mv=pid=>{const p=page(pid);p.spaceId=sp;db.pages.filter(k=>k.parentId===pid).forEach(k=>mv(k.id))};const p=page(id);if(p.parentId&&page(p.parentId)?.spaceId!==sp)p.parentId=null;mv(id);save();render()}
function pickIcon(id,el){
  const icons=['📄','📁','🚀','💡','🔁','🎯','📊','💰','🧪','🫧','🧀','🥤','📦','🛒','📣','🎨','✍️','🤝','📅','🏁','🌿','❤️','⭐','🔥'];
  showMenu(el.getBoundingClientRect(),icons.map(i=>({k:i,l:'',f:()=>{page(id).icon=i;touch(page(id));render()}})));
  const m=$('#menu');m.style.minWidth='0';m.style.display='grid';m.style.gridTemplateColumns='repeat(6,1fr)';
  $$('.mi',m).forEach(x=>x.style.justifyContent='center');
  const restore=()=>{m.style.display='none';m.style.gridTemplateColumns='';m.style.minWidth='';document.removeEventListener('mousedown',restore)};
  setTimeout(()=>document.addEventListener('mousedown',e=>{if(!e.target.closest('#menu'))restore()}),0);

function touch(p){p.updatedAt=Date.now();save()}

/* ============ editor de blocos ============ */
const BLOCKS=[
  {t:'p',k:'¶',l:'Texto'},{t:'h1',k:'H1',l:'Título'},{t:'h2',k:'H2',l:'Subtítulo'},{t:'h3',k:'H3',l:'Título pequeno'},
  {t:'todo',k:'☐',l:'Checklist'},{t:'bullet',k:'•',l:'Lista'},{t:'num',k:'1.',l:'Lista numerada'},
  {t:'quote',k:'❝',l:'Citação'},{t:'callout',k:'💡',l:'Destaque'},{t:'code',k:'</>',l:'Código'},{t:'divider',k:'—',l:'Divisória'},
  {t:'task',k:'✅',l:'Criar tarefa a partir do texto'}
];
let curPage=null;
function renderBlocks(p,focusId,caretEnd=true){
  curPage=p;const wrap=$('#blocks');if(!wrap)return;
  let n=0;
  wrap.innerHTML=p.blocks.map((b,i)=>{
    if(b.type==='num')n++;else n=0;
    if(b.type==='divider')return `<div class="block divider" data-id="${b.id}"><button class="handle" data-act="h">⋮⋮</button><hr></div>`;
    return `<div class="block ${b.type} ${b.checked?'checked':''}" data-id="${b.id}">
      <button class="handle" data-act="h">⋮⋮</button>
      ${b.type==='todo'?`<input type="checkbox" ${b.checked?'checked':''}>`:''}
      ${b.type==='num'?`<span class="n">${n}.</span>`:''}
      <div class="txt" contenteditable="true" data-ph="${b.type==='p'?'Digite / para comandos':BLOCKS.find(x=>x.t===b.type)?.l||''}">${esc(b.text)}</div></div>`}).join('');
  if(focusId)focusBlock(focusId,caretEnd);
}
function focusBlock(id,end=true){
  const el=$(`.block[data-id="${id}"] .txt`);if(!el)return;el.focus();
  const r=document.createRange();r.selectNodeContents(el);r.collapse(!end);const s=getSelection();s.removeAllRanges();s.addRange(r);
}
function caretAtStart(el){const s=getSelection();if(!s.rangeCount)return false;const r=s.getRangeAt(0);if(!r.collapsed)return false;const pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);return pre.toString().length===0}
function splitAtCaret(el){const s=getSelection();const r=s.getRangeAt(0);const pre=document.createRange();pre.selectNodeContents(el);pre.setEnd(r.startContainer,r.startOffset);const post=document.createRange();post.selectNodeContents(el);post.setStart(r.endContainer,r.endOffset);return[pre.toString(),post.toString()]}
function bindBlocks(p){
  const wrap=$('#blocks');if(!wrap)return;
  const blk=e=>{const b=e.target.closest('.block');return b&&p.blocks.find(x=>x.id===b.dataset.id)};
  let slash=null;
  wrap.addEventListener('input',e=>{
    const b=blk(e);if(!b||!e.target.classList.contains('txt'))return;
    let t=e.target.innerText.replace(/\n$/,'');
    const md=[['# ','h1'],['## ','h2'],['### ','h3'],['[] ','todo'],['[ ] ','todo'],['- ','bullet'],['* ','bullet'],['1. ','num'],['> ','quote'],['```','code']];
    for(const[pre,ty]of md){if(t.startsWith(pre)&&b.type!==ty&&(b.type==='p'||ty!=='p')){b.type=ty;b.text=t.slice(pre.length);touch(p);renderBlocks(p,b.id);return}}
    if(t==='---'){b.type='divider';b.text='';const nb={id:uid(),type:'p',text:''};p.blocks.splice(p.blocks.indexOf(b)+1,0,nb);touch(p);renderBlocks(p,nb.id);return}
    b.text=t;touch(p);
    // menu /
    if(t.startsWith('/')){
      const q=t.slice(1).toLowerCase();
      const opts=BLOCKS.filter(x=>x.l.toLowerCase().includes(q)||x.t.includes(q));
      if(opts.length){slash=b;showMenu(e.target.getBoundingClientRect(),opts.map(o=>({k:o.k,l:o.l,f:()=>applyBlock(p,b,o.t)})));}
      else hideMenu();
    }else if(slash){slash=null;hideMenu()}
  });
  wrap.addEventListener('keydown',e=>{
    const b=blk(e);if(!b||!e.target.classList.contains('txt'))return;
    const i=p.blocks.indexOf(b);
    if(menuItems.length&&$('#menu').style.display==='block'){
      if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();menuSel=(menuSel+(e.key==='ArrowDown'?1:-1)+menuItems.length)%menuItems.length;$$('#menu .mi').forEach((x,j)=>x.classList.toggle('sel',j===menuSel));return}
      if(e.key==='Enter'){e.preventDefault();const it=menuItems[menuSel];hideMenu();it.f();return}
      if(e.key==='Escape'){hideMenu();return}
    }
    if(e.key==='Enter'&&!e.shiftKey&&b.type!=='code'){
      e.preventDefault();
      const[a,rest]=splitAtCaret(e.target);
      const cont=['todo','bullet','num'].includes(b.type);
      if(cont&&!a&&!rest){b.type='p';touch(p);renderBlocks(p,b.id);return}
      b.text=a;const nb={id:uid(),type:cont?b.type:'p',text:rest,checked:false};
      p.blocks.splice(i+1,0,nb);touch(p);renderBlocks(p,nb.id,false);return;
    }
    if(e.key==='Backspace'&&caretAtStart(e.target)&&!getSelection().toString()){
      if(b.type!=='p'){e.preventDefault();b.type='p';touch(p);renderBlocks(p,b.id,false);return}
      if(i>0){e.preventDefault();let prev=p.blocks[i-1];
        if(prev.type==='divider'){p.blocks.splice(i-1,1);touch(p);renderBlocks(p,b.id,false);return}
        const len=prev.text.length;prev.text+=b.text;p.blocks.splice(i,1);touch(p);renderBlocks(p);
        const el=$(`.block[data-id="${prev.id}"] .txt`);el.focus();const s=getSelection();const r=document.createRange();
        const node=el.firstChild||el;r.setStart(node,Math.min(len,node.textContent.length));r.collapse(true);s.removeAllRanges();s.addRange(r);return}
    }
    if(e.key==='ArrowUp'&&i>0&&caretAtStart(e.target)){e.preventDefault();const prev=[...p.blocks.slice(0,i)].reverse().find(x=>x.type!=='divider');if(prev)focusBlock(prev.id)}
    if(e.key==='ArrowDown'&&i<p.blocks.length-1){const s=getSelection();const r=s.getRangeAt(0);const post=document.createRange();post.selectNodeContents(e.target);post.setStart(r.endContainer,r.endOffset);if(!post.toString().length){e.preventDefault();const nx=p.blocks.slice(i+1).find(x=>x.type!=='divider');if(nx)focusBlock(nx.id,false)}}
    if(e.key==='Tab'){e.preventDefault()}
  });
  wrap.addEventListener('paste',e=>{
    if(!e.target.classList.contains('txt'))return;
    e.preventDefault();const text=(e.clipboardData||window.clipboardData).getData('text/plain');
    const lines=text.replace(/\r/g,'').split('\n');
    if(lines.length===1){document.execCommand('insertText',false,text);return}
    const b=blk(e);const i=p.blocks.indexOf(b);const[a,rest]=splitAtCaret(e.target);
    b.text=a+lines[0];
    const parse=l=>{const m=[[/^#\s/,'h1'],[/^##\s/,'h2'],[/^###\s/,'h3'],[/^- \[[ x]\]\s/i,'todo'],[/^[-*•]\s/,'bullet'],[/^\d+[.)]\s/,'num'],[/^>\s/,'quote']];
      for(const[re,t]of m)if(re.test(l))return{id:uid(),type:t,text:l.replace(re,''),checked:/^- \[x\]/i.test(l)};return{id:uid(),type:'p',text:l}};
    const nbs=lines.slice(1).filter((l,j,arr)=>l.trim()||j<arr.length-1).map(parse);
    if(nbs.length)nbs[nbs.length-1].text+=rest;else b.text+=rest;
    p.blocks.splice(i+1,0,...nbs);touch(p);renderBlocks(p,(nbs[nbs.length-1]||b).id);
  });
  wrap.addEventListener('change',e=>{if(e.target.type==='checkbox'){const b=blk(e);b.checked=e.target.checked;e.target.closest('.block').classList.toggle('checked',b.checked);touch(p)}});
  wrap.addEventListener('click',e=>{
    if(e.target.dataset.act==='h'){const b=blk(e);const i=p.blocks.indexOf(b);
      showMenu(e.target.getBoundingClientRect(),[
        {k:'↑',l:'Mover para cima',f:()=>{if(i>0){p.blocks.splice(i,1);p.blocks.splice(i-1,0,b);touch(p);renderBlocks(p)}}},
        {k:'↓',l:'Mover para baixo',f:()=>{if(i<p.blocks.length-1){p.blocks.splice(i,1);p.blocks.splice(i+1,0,b);touch(p);renderBlocks(p)}}},
        {k:'⧉',l:'Duplicar',f:()=>{p.blocks.splice(i+1,0,{...b,id:uid()});touch(p);renderBlocks(p)}},
        {k:'✅',l:'Transformar em tarefa',f:()=>blockToTask(p,b)},
        ...BLOCKS.filter(x=>x.t!=='task'&&x.t!==b.type).slice(0,7).map(x=>({k:x.k,l:'Virar '+x.l.toLowerCase(),f:()=>{b.type=x.t;touch(p);renderBlocks(p,b.id)}})),
        {k:'🗑',l:'Apagar bloco',f:()=>{p.blocks.splice(i,1);if(!p.blocks.length)p.blocks.push({id:uid(),type:'p',text:''});touch(p);renderBlocks(p)}}]);
    }
  });
  // clique abaixo dos blocos foca o último / cria um novo
  wrap.parentElement.querySelector('.hint')?.addEventListener('click',()=>{const last=p.blocks[p.blocks.length-1];if(!last||last.type!=='p'||last.text){const nb={id:uid(),type:'p',text:''};p.blocks.push(nb);touch(p);renderBlocks(p,nb.id)}else focusBlock(last.id)});
}
function applyBlock(p,b,t){
  b.text=b.text.replace(/^\/\S*/,'');
  if(t==='task'){blockToTask(p,b);return}
  b.type=t;
  if(t==='divider'){b.text='';const nb={id:uid(),type:'p',text:''};p.blocks.splice(p.blocks.indexOf(b)+1,0,nb);touch(p);renderBlocks(p,nb.id);return}
  touch(p);renderBlocks(p,b.id);
}
function blockToTask(p,b){
  const title=b.text.trim()||'Nova tarefa';
  const projectId=p.type==='project'?p.id:(ancestorProject(p)?.id||null);
  const t={id:uid(),title,status:'todo',projectId,spaceId:p.spaceId,due:'',priority:'normal',notes:'Criada a partir de: '+(p.title||'página'),createdAt:Date.now()};
  db.tasks.push(t);b.type='todo';b.text='→ '+title;touch(p);renderBlocks(p);
  toast('Tarefa criada');
}
function ancestorProject(p){let c=p;while(c&&c.parentId){c=page(c.parentId);if(c&&c.type==='project')return c}return null}

/* ============ brainstorm ============ */
function renderCanvas(p){
  const cv=$('#canvas');if(!cv)return;
  cv.innerHTML=(p.cards||[]).map(c=>`<div class="sticky c-${c.color}" data-id="${c.id}" style="left:${c.x}px;top:${c.y}px">
    <div class="bar"><button data-a="task" title="Virar tarefa">✅</button><button data-a="del" title="Apagar">✕</button></div>
    <div class="txt" contenteditable="true">${esc(c.text)}</div></div>`).join('');
  $$('.sticky',cv).forEach(el=>{
    const c=p.cards.find(x=>x.id===el.dataset.id);
    $('.txt',el).addEventListener('input',e=>{c.text=e.target.innerText;touch(p)});
    $('[data-a=del]',el).onclick=()=>{p.cards=p.cards.filter(x=>x!==c);touch(p);renderCanvas(p)};
    $('[data-a=task]',el).onclick=()=>{db.tasks.push({id:uid(),title:c.text.split('\n')[0]||'Ideia',status:'todo',projectId:ancestorProject(p)?.id||null,spaceId:p.spaceId,due:'',priority:'normal',notes:c.text,createdAt:Date.now()});save();toast('Tarefa criada')};
    $('.bar',el).addEventListener('pointerdown',e=>{
      if(e.target.tagName==='BUTTON')return;e.preventDefault();
      const sx=e.clientX,sy=e.clientY,ox=c.x,oy=c.y;el.style.zIndex=10;
      const mv=ev=>{c.x=Math.max(0,ox+ev.clientX-sx);c.y=Math.max(0,oy+ev.clientY-sy);el.style.left=c.x+'px';el.style.top=c.y+'px'};
      const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);el.style.zIndex='';touch(p)};
      document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
    });
  });
}
function addSticky(color){
  const p=curPage;const cv=$('#canvas');
  const c={id:uid(),text:'',color,x:cv.scrollLeft+30+Math.random()*200,y:cv.scrollTop+30+Math.random()*120};
  p.cards.push(c);touch(p);renderCanvas(p);$(`.sticky[data-id="${c.id}"] .txt`).focus();
}

/* ============ tarefas ============ */
const prioRank={urgente:0,alta:1,normal:2,baixa:3};
const taskSort=(a,b)=>(a.status==='done')-(b.status==='done')||(a.due||'9999').localeCompare(b.due||'9999')||prioRank[a.priority]-prioRank[b.priority];
function taskTable(ts){
  if(!ts.length)return '<div class="empty">Nenhuma tarefa.</div>';
  const t=today();
  return `<table class="tasks">${ts.map(x=>{const pj=page(x.projectId);return `<tr class="${x.status}">
    <td class="chk"><input type="checkbox" ${x.status==='done'?'checked':''} onclick="toggleTask('${x.id}')"></td>
    <td class="ttl" onclick="openTask('${x.id}')">${esc(x.title)} ${x.source?'<span class="pill src">🎙️ reunião</span>':''}</td>
    <td>${pj?`<span class="pill">${pj.icon||''} ${esc(pj.title)}</span>`:''}</td>
    <td><span class="pill ${x.status}">${statusLbl[x.status]}</span></td>
    <td>${prioPill(x.priority)}${x.tipo?` <span class="pill tipo">${esc(x.tipo)}</span>`:''}</td>
    <td style="text-align:right">${x.due?`<span class="pill ${x.due<t&&x.status!=='done'?'late':''}">${fmtDate(x.due)}</span>`:''}</td></tr>`}).join('')}</table>`;
}
function filteredTasks(){
  const f=ui.taskFilter;
  return db.tasks.filter(t=>(f.space==='all'||t.spaceId===f.space)&&(f.project==='all'||(f.project==='none'?!t.projectId:t.projectId===f.project))&&(f.status==='all'||(f.status==='open'?t.status!=='done':t.status===f.status)));
}
function taskMatch(x){const f=ui.taskFilter;return (f.space==='all'||x.spaceId===f.space)&&(f.project==='all'||(f.project==='none'?!x.projectId:x.projectId===f.project))&&(!f.owner||f.owner==='all'||(x.owner||'Juju')===f.owner)}
function viewTasks(){
  const f=ui.taskFilter;const t=today();const v=ui.taskView;
  const card=x=>{const pj=page(x.projectId);const sp=space(x.spaceId);return `<div class="card" draggable="true" data-id="${x.id}" onclick="openTask('${x.id}')">${esc(x.title)}
      <div class="sub">${f.space==='all'&&sp?`<span class="pill">${sp.icon} ${esc(sp.name)}</span>`:''}${pj?`<span class="pill">${pj.icon||''} ${esc(pj.title)}</span>`:''}${prioPill(x.priority)}${x.owner&&x.owner!=='Juju'?`<span class="pill">👤 ${esc(x.owner)}</span>`:''}${x.due?`<span class="pill ${x.due<t&&x.status!=='done'?'late':''}">${fmtDate(x.due)}</span>`:''}${x.source?'<span class="pill src">🎙️</span>':''}</div></div>`};
  let body='';
  if(v==='board'){
    body=`<div class="board">${Object.keys(statusLbl).map(s=>{
      let col=db.tasks.filter(x=>x.status===s&&taskMatch(x)).sort(taskSort);
      const total=col.length; if(s==='done')col=col.sort((a,b)=>(b.doneAt||0)-(a.doneAt||0)).slice(0,25);
      return `<div class="col" data-s="${s}"><h3><span>${statusLbl[s]}</span><span>${total}</span></h3>${col.map(card).join('')}${s==='done'&&total>25?`<div class="empty">+${total-25} na lista</div>`:''}</div>`}).join('')}</div>`;
  }else if(v==='agenda'){
    const ts=db.tasks.filter(x=>x.status!=='done'&&taskMatch(x)).sort(taskSort);
    const d=new Date();const add=n=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
    const tm=add(1), wk=add(7);
    const groups=[['Atrasadas',x=>x.due&&x.due<t,'red'],['Hoje',x=>x.due===t],['Amanhã',x=>x.due===tm],['Próximos 7 dias',x=>x.due>tm&&x.due<=wk],['Mais pra frente',x=>x.due>wk],['Sem prazo',x=>!x.due]];
    body=groups.map(([l,fn,c])=>{const g=ts.filter(fn);return g.length?`<div class="group-h ${c||''}">${l} · ${g.length}</div>${taskTable(g)}`:''}).join('');
  }else if(v==='frente'){
    const ts=db.tasks.filter(x=>x.status!=='done'&&taskMatch(x)).sort(taskSort);
    body=db.spaces.map(s=>{const g=ts.filter(x=>x.spaceId===s.id);return g.length?`<div class="group-h">${s.icon} ${esc(s.name)} · ${g.length}</div>${taskTable(g)}`:''}).join('');
  }else{
    const ts=db.tasks.filter(x=>taskMatch(x)&&(f.status==='all'||(f.status==='open'?x.status!=='done':x.status===f.status))).sort(taskSort);
    body=taskTable(ts);
  }
  const owners=[...new Set(db.tasks.map(x=>x.owner||'Juju'))].sort();
  return `<div class="wrap wide">
    <h1 class="title">Tarefas</h1>
    <div class="task-add"><input id="quick" placeholder="Nova tarefa... (Enter)  dica: !urgente, !alta, @hoje, @amanhã, @20/11"></div>
    <div class="filters">
      <div class="tabs">${[['board','Kanban'],['agenda','Agenda'],['frente','Por frente'],['list','Lista']].map(([k,l])=>`<button class="${v===k?'on':''}" onclick="ui.taskView='${k}';saveUI();render()">${l}</button>`).join('')}</div>
      <select onchange="ui.taskFilter.space=this.value;saveUI();render()"><option value="all">Todas as frentes</option>${db.spaces.map(s=>`<option value="${s.id}" ${f.space===s.id?'selected':''}>${s.icon} ${esc(s.name)}</option>`).join('')}</select>
      <select onchange="ui.taskFilter.project=this.value;saveUI();render()"><option value="all">Todos os projetos</option><option value="none" ${f.project==='none'?'selected':''}>Sem projeto</option>${projects().map(p=>`<option value="${p.id}" ${f.project===p.id?'selected':''}>${esc(p.title||'Sem título')}</option>`).join('')}</select>
      <select onchange="ui.taskFilter.owner=this.value;saveUI();render()"><option value="all">Todos os responsáveis</option>${owners.map(o=>`<option ${f.owner===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
      ${v==='list'?`<select onchange="ui.taskFilter.status=this.value;saveUI();render()">${[['open','Abertas'],['all','Todas'],['todo','A fazer'],['doing','Fazendo'],['waiting','Aguardando'],['done','Feitas']].map(([k,l])=>`<option value="${k}" ${f.status===k?'selected':''}>${l}</option>`).join('')}</select>`:''}
    </div>${body}</div>`;
}
function parseQuick(txt){
  let title=txt,priority='normal',due='';
  if(/!urgente\b/i.test(title)){priority='urgente';title=title.replace(/!urgente\b/i,'')}
  if(/!alta\b/i.test(title)){priority='alta';title=title.replace(/!alta\b/i,'')}
  if(/!baixa\b/i.test(title)){priority='baixa';title=title.replace(/!baixa\b/i,'')}
  const d=new Date();
  if(/@hoje\b/i.test(title)){due=today();title=title.replace(/@hoje\b/i,'')}
  if(/@amanh[ãa](?=\s|$)/i.test(title)){d.setDate(d.getDate()+1);due=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');title=title.replace(/@amanh[ãa](?=\s|$)/i,'')}
  const m=title.match(/@(\d{1,2})\/(\d{1,2})/);if(m){due=d.getFullYear()+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');title=title.replace(m[0],'')}
  return{title:title.trim(),priority,due};
}
function addTask(txt,extra={}){
  const q=parseQuick(txt);if(!q.title)return;
  const f=ui.taskFilter;
  const hs=(location.hash||'#/home').startsWith('#/home')&&ui.homeSpace&&ui.homeSpace!=='all'?ui.homeSpace:null;
  const t={id:uid(),status:'todo',owner:'Juju',projectId:f.project!=='all'&&f.project!=='none'?f.project:null,spaceId:hs||(f.space!=='all'?f.space:db.spaces[0].id),notes:'',createdAt:Date.now(),...q,...extra};
  if(t.projectId&&page(t.projectId))t.spaceId=page(t.projectId).spaceId;
  db.tasks.push(t);save();return t;
}
function toggleTask(id){const t=db.tasks.find(x=>x.id===id);t.status=t.status==='done'?'todo':'done';if(t.status==='done')t.doneAt=Date.now();save();render()}

async function connect(){
  const owner=$('#cowner').value.trim(),repo=$('#crepo').value.trim(),token=$('#ctoken').value.trim();
  const msg=$('#cmsg');msg.textContent='Testando...';
  try{
    const r=await fetch(`https://api.github.com/repos/${owner}/${repo}`,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
    if(r.status===404||r.status===401)throw new Error('não achei o repositório. Confira usuário, nome do repositório e se o token dá acesso a ele.');
    if(!r.ok)throw new Error('GitHub respondeu '+r.status);
    const j=await r.json();if(!j.private&&!confirm('Este repositório é PÚBLICO. Seus dados ficariam visíveis pra qualquer pessoa. Continuar mesmo assim?'))return;
    cfg={owner,repo,token};localStorage.setItem(LS_CFG,JSON.stringify(cfg));
    // tem dados lá? se não, sobe os locais
    const g=await gh('GET');
    if(g.status===404){sha=null;await push();msg.textContent='Conectado. Seus dados foram enviados pro GitHub.'}
    else{const local=JSON.stringify(db);await pull();msg.textContent='Conectado. Dados carregados do GitHub.'}
    renderSide();setSync('ok','Salvo no GitHub');
  }catch(e){msg.style.color='var(--danger)';msg.textContent='Erro: '+e.message}
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='caderno-backup-'+today()+'.json';a.click()}
function mergeImport(d){
  if(!d||!d.tasks)return alert('Arquivo inválido');
  const known=new Set(db.tasks.map(t=>t.id));
  if(d.tasks.every(t=>known.has(t.id)))return toast('Esses dados já estavam importados');
  const map={};
  (d.spaces||[]).forEach(s=>{const e=db.spaces.find(x=>x.id===s.id||x.name.toLowerCase()===s.name.toLowerCase());if(e){map[s.id]=e.id}else{db.spaces.push(s);map[s.id]=s.id}});
  const demo=db.pages.filter(p=>(p.title==='Lançamento Blub+'&&(p.blocks||[]).some(b=>b.text==='Escreva aqui o objetivo do projeto.'))||(p.title==='Ideias de sabores'&&(p.cards||[]).some(c=>c.text==='Maracujá com hortelã')));
  const demoIds=demo.map(p=>p.id);
  db.pages=db.pages.filter(p=>!demoIds.includes(p.id));
  db.tasks=db.tasks.filter(t=>!(t.title==='Fechar data de lançamento do Blub+'&&demoIds.includes(t.projectId)));
  const pids=new Set(db.pages.map(p=>p.id)),now=Date.now();
  (d.pages||[]).forEach(p=>{if(pids.has(p.id))return;p.spaceId=map[p.spaceId]||p.spaceId;p.updatedAt=now;db.pages.push(p)});
  let n=0;d.tasks.forEach(t=>{if(known.has(t.id))return;t.spaceId=map[t.spaceId]||t.spaceId;db.tasks.push(t);n++});
  const order=(d.spaces||[]).map(s=>map[s.id]);const rk=id=>{const i=order.indexOf(id);return i<0?99:i};
  db.spaces.sort((a,b)=>rk(a.id)-rk(b.id));
  migrate();save();render();toast(n+' tarefas importadas');
}
function importData(f){if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(!d.pages)return alert('Arquivo inválido');if(confirm('Substituir tudo pelo backup?')){db=d;save();render()}})}

function doSearch(q){

    ...db.pages.map(p=>({ic:p.icon||'📄',l:p.title||'Sem título',t:typeLbl[p.type],h:'#/page/'+p.id,s:(p.title+' '+(p.blocks||[]).map(b=>b.text).join(' ')+' '+(p.cards||[]).map(c=>c.text).join(' ')).toLowerCase()})),
    ...db.tasks.map(t=>({ic:t.status==='done'?'☑':'☐',l:t.title,t:'Tarefa',task:t.id,s:(t.title+' '+t.notes).toLowerCase()})),
    ...db.meetings.map(m=>({ic:'🎙️',l:m.title,t:'Reunião',h:'#/meeting/'+m.id,s:(m.title+' '+m.summary+' '+(m.decisions||[]).join(' ')).toLowerCase()}))];
  sRes=(q?items.filter(x=>x.s.includes(q)):items.filter(x=>x.h)).slice(0,30);sSel=0;

  $$('#search .r').forEach(el=>el.onclick=()=>pickSearch(+el.dataset.i));
}
function pickSearch(i){const r=sRes[i];if(!r)return;closeSearch();if(r.task)openTask(r.task);else go(r.h)}
$('#search input').addEventListener('input',e=>doSearch(e.target.value));
$('#search input').addEventListener('keydown',e=>{
